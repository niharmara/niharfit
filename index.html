<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0f0f0f">
<title>NiharFit — Import History</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f0f0f; color: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1a1a1a; border: 1px solid #2e2e2e;
    border-radius: 16px; padding: 28px 24px; max-width: 400px; width: 100%;
    text-align: center;
  }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
  .sub { font-size: 14px; color: #888; margin-bottom: 24px; line-height: 1.5; }
  .stat-row { display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; }
  .stat { text-align: center; }
  .stat-num { font-size: 28px; font-weight: 800; color: #e8ff47; }
  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }
  .btn {
    display: block; width: 100%; padding: 16px;
    background: #e8ff47; color: #000; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 800;
    cursor: pointer; margin-bottom: 10px; letter-spacing: -.3px;
  }
  .btn:active { opacity: .85; }
  .btn-sec {
    background: #242424; color: #f0f0f0;
    border: 1px solid #2e2e2e; font-size: 14px;
    font-weight: 600; padding: 12px;
  }
  .status {
    margin-top: 20px; padding: 14px; border-radius: 10px;
    font-size: 14px; font-weight: 600; display: none;
  }
  .status.success { background: #47ff9a20; border: 1px solid #47ff9a40; color: #47ff9a; }
  .status.error { background: #ff474720; border: 1px solid #ff474740; color: #ff4747; }
  .warning {
    background: #ffb34710; border: 1px solid #ffb34730;
    border-radius: 10px; padding: 12px; margin-bottom: 20px;
    font-size: 12px; color: #ffb347; line-height: 1.5; text-align: left;
  }
  .session-list {
    text-align: left; margin-top: 20px; max-height: 200px;
    overflow-y: auto; font-size: 11px; color: #666;
    border-top: 1px solid #2e2e2e; padding-top: 12px;
  }
  .session-list div { padding: 2px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>Import Spotter History</h1>
  <p class="sub">Inject your full year of workout data into NiharFit's local storage.</p>

  <div class="stat-row">
    <div class="stat">
      <div class="stat-num">247</div>
      <div class="stat-label">Sessions</div>
    </div>
    <div class="stat">
      <div class="stat-num">1yr</div>
      <div class="stat-label">History</div>
    </div>
    <div class="stat">
      <div class="stat-num">4,150</div>
      <div class="stat-label">Sets</div>
    </div>
  </div>

  <div class="warning">
    ⚠️ <strong>Open this page on the same device/browser where you use NiharFit.</strong>
    LocalStorage is per-browser. If you use the app on iPhone Safari, open this page in iPhone Safari.
  </div>

  <button class="btn" onclick="doImport()">Import All History →</button>
  <button class="btn btn-sec" onclick="doMerge()">Merge (keep existing + add new)</button>

  <div class="status" id="status"></div>
</div>

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
  el.style.display = 'block';
}

function doImport() {
  try {
    // Check storage availability
    const testKey = '__nf_test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    
    localStorage.setItem('nf_history', JSON.stringify(HISTORY_DATA));
    const size = JSON.stringify(HISTORY_DATA).length;
    showStatus(
      '✅ Imported ' + HISTORY_DATA.length + ' sessions (' + Math.round(size/1024) + ' KB). ' +
      'Open NiharFit — your history is ready.',
      'success'
    );
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      showStatus('❌ Storage quota exceeded. Try clearing other site data in Safari settings and retry.', 'error');
    } else {
      showStatus('❌ Error: ' + e.message, 'error');
    }
  }
}

function doMerge() {
  try {
    const existing = JSON.parse(localStorage.getItem('nf_history') || '[]');
    const existingDates = new Set(existing.map(s => s.date));
    
    // Add any Spotter sessions not already in local history
    const toAdd = HISTORY_DATA.filter(s => !existingDates.has(s.date));
    const merged = [...existing, ...toAdd].sort((a,b) => a.date < b.date ? -1 : 1);
    
    localStorage.setItem('nf_history', JSON.stringify(merged));
    showStatus(
      '✅ Merged: kept ' + existing.length + ' existing + added ' + toAdd.length + 
      ' new sessions = ' + merged.length + ' total. Open NiharFit.',
      'success'
    );
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      showStatus('❌ Storage full. Use "Import All" instead (replaces existing data).', 'error');
    } else {
      showStatus('❌ Error: ' + e.message, 'error');
    }
  }
}
